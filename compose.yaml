services:
  majordomo:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Local-first default: a local Ollama on the host. From inside the
      # container, the host is host.docker.internal. To use a hosted
      # model instead, set MAJORDOMO_PROVIDER to any preset name (e.g.
      # "anthropic" or "deepseek") and pass that provider's key variable
      # in your shell or a local .env file — every key variable is passed
      # through below, empty when unset.
      MAJORDOMO_PROVIDER: "${MAJORDOMO_PROVIDER:-ollama}"
      MAJORDOMO_MODEL: "${MAJORDOMO_MODEL:-}"
      MAJORDOMO_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      MAJORDOMO_OLLAMA_MODEL: "llama3.1"
      MAJORDOMO_ANTHROPIC_API_KEY: "${MAJORDOMO_ANTHROPIC_API_KEY:-}"
      MAJORDOMO_OPENAI_API_KEY: "${MAJORDOMO_OPENAI_API_KEY:-}"
      MAJORDOMO_DEEPSEEK_API_KEY: "${MAJORDOMO_DEEPSEEK_API_KEY:-}"
      MAJORDOMO_GEMINI_API_KEY: "${MAJORDOMO_GEMINI_API_KEY:-}"
      MAJORDOMO_OPENROUTER_API_KEY: "${MAJORDOMO_OPENROUTER_API_KEY:-}"
      MAJORDOMO_GROQ_API_KEY: "${MAJORDOMO_GROQ_API_KEY:-}"
      MAJORDOMO_MISTRAL_API_KEY: "${MAJORDOMO_MISTRAL_API_KEY:-}"
      MAJORDOMO_XAI_API_KEY: "${MAJORDOMO_XAI_API_KEY:-}"
      MAJORDOMO_TOGETHER_API_KEY: "${MAJORDOMO_TOGETHER_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - majordomo-data:/data
    restart: unless-stopped

volumes:
  majordomo-data:
