[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "majordomo"
version = "0.9.0"
description = "Your self-hosted personal AI agent — lives on your machine, remembers what matters, and gets the work done."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kevin Doherty" }]
keywords = ["personal-ai-agent", "ai-agent", "self-hosted", "llm", "mcp", "ollama", "local-first", "ai-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "tenacity",
  "structlog",
  "typer",
  "rich",
  "fastapi",
  "uvicorn",
]

[project.urls]
Homepage = "https://github.com/EdgeAgent/majordomo"
Repository = "https://github.com/EdgeAgent/majordomo"

[project.scripts]
majordomo = "majordomo.cli:app"

[project.optional-dependencies]
documents = [
  "python-docx",
  "python-pptx",
  "openpyxl",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/majordomo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
