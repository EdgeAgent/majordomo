<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Majordomo banner</title>
  <desc id="desc">Majordomo — your self-hosted personal AI agent. Navy, gold, and teal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A14"/>
      <stop offset="1" stop-color="#111B36"/>
    </linearGradient>
    <linearGradient id="rule" x1="80" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
